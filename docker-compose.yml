name: 3d-bus-tracker

services:
  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-bus_tracker}
      MARIADB_USER: ${MARIADB_USER:-bus_tracker}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-root-me}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-env
      NODE_ENV: production
      API_PORT: 3000
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE:-bus_tracker}
      MARIADB_USER: ${MARIADB_USER:-bus_tracker}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change-me}
      VEHICLE_SOURCE: ${VEHICLE_SOURCE:-mock}
      VEHICLE_POLL_INTERVAL_MS: ${VEHICLE_POLL_INTERVAL_MS:-15000}
      BUSTIMES_VEHICLES_URL: ${BUSTIMES_VEHICLES_URL:-}
      BUS_FEED_MIN_LAT: ${BUS_FEED_MIN_LAT:-49.5}
      BUS_FEED_MAX_LAT: ${BUS_FEED_MAX_LAT:-61.2}
      BUS_FEED_MIN_LON: ${BUS_FEED_MIN_LON:--8.7}
      BUS_FEED_MAX_LON: ${BUS_FEED_MAX_LON:-2.2}
      VEHICLE_REMOVE_MS: ${VEHICLE_REMOVE_MS:-180000}
      INGESTION_TOKEN: ${INGESTION_TOKEN:-local-development-token}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        VITE_RENDER_DELAY_MS: ${RENDER_DELAY_MS:-5000}
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  mariadb-data:
